spring:
  datasources:
    url: ${SPRING-DATASOURCE_URL:jdbc:postgresql://localhost:5432/onboarding_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${PRING_DATASOURCE_PASSWORD:secretpassword}
    driver-class-name: org.postgresl.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080