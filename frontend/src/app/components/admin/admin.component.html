<div class="admin-container">
    <h1>Painel do Administrador</h1>
    <p>Gestão de Módulos de OnBoarding</p>

    <div class="card form-card">
        <h3>Criar novo módulo</h3>
        <form [formGroup]="moduleForm" (ngSubmit)="onCreateModule()">
            <div class="form-group">
                <label>Título do módulo</label>
                <input type="text" formControlName="title" placeholder="Ex: Conceitos da Linguagem Python">
            </div>

            <div class="form-group">
                <label>Descrição</label>
                <textarea formControlName="description" rows="3" placeholder="Descrição do conteúdo..."></textarea>
            </div>

            <button type="submit" [disabled]="moduleForm.invalid" class="btn-primary">
                Adicionar
            </button>
        </form>
    </div>

    <div class="card list-card">
        <h3>Módulos existentes ({{ modules.length }})</h3>

        <table *ngIf="modules.length > 0; else noModules">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Descrição</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let mod of modules">
                    <td>{{ mod.id }}</td>
                    <td><strong>{{ mod.title }}</strong></td>
                    <td>{{ mod.description }}</td>
                    <td>
                        <button (click)="onDeleteModule(mod.id)" class="btn-danger">Excluir</button>
                    </td>
                </tr>
            </tbody>
        </table>

        <ng-template #noModules>
            <p>Nenhum módulo registrado</p>
        </ng-template>
    </div>
</div>
